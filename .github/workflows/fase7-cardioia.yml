name: CardioIA Fase 7 — Web e Mobile

# Verificação contínua do front-end. O deploy do web é feito pela integração
# Git da Vercel (cada push na main publica a URL de produção).
on:
  push:
    branches: [main]
    paths:
      - '2TIAO/FASE7-CARDIOIA/web/**'
      - '2TIAO/FASE7-CARDIOIA/mobile/**'
      - '.github/workflows/fase7-cardioia.yml'
  pull_request:
    paths:
      - '2TIAO/FASE7-CARDIOIA/web/**'
      - '2TIAO/FASE7-CARDIOIA/mobile/**'
      - '.github/workflows/fase7-cardioia.yml'

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 2TIAO/FASE7-CARDIOIA/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: 2TIAO/FASE7-CARDIOIA/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 2TIAO/FASE7-CARDIOIA/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: 2TIAO/FASE7-CARDIOIA/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx expo-doctor
      - run: npx expo export --platform android --output-dir /tmp/android-bundle
