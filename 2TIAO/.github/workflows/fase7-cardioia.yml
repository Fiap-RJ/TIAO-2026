name: CardioIA Fase 7

on:
  push:
    branches: [main]
    paths: ["2TIAO/FASE7-CARDIOIA/**"]
  pull_request:
    paths: ["2TIAO/FASE7-CARDIOIA/**"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 2TIAO/FASE7-CARDIOIA/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 2TIAO/FASE7-CARDIOIA/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: 2TIAO/FASE7-CARDIOIA/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
