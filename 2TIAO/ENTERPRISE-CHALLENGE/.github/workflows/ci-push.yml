name: CI (Push)

on:
  push:
    branches: ['**']

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-in-project: true

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: poetry-${{ runner.os }}-py3.12-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-py3.12-

      - name: Install dependencies
        run: poetry install

      - name: Run Ruff check
        run: poetry run ruff check src/backend

  test:
    name: Test (pytest, no API calls)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-in-project: true

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: poetry-${{ runner.os }}-py3.12-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-py3.12-

      - name: Install dependencies
        run: poetry install

      - name: Run pytest (fast tests, no API keys)
        run: poetry run pytest -v -m "not requires_api_key" --tb=short
        env:
          PYTHONPATH: src/backend

  smoke-eval:
    name: Smoke Eval (5 cases, if GOOGLE_API_KEY available)
    runs-on: ubuntu-latest
    if: secrets.GOOGLE_API_KEY != ''
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-in-project: true

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: poetry-${{ runner.os }}-py3.12-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-py3.12-

      - name: Install dependencies
        run: poetry install

      - name: Run smoke eval (5 cases)
        run: poetry run python -m eval
        env:
          PYTHONPATH: src/backend
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          EVAL_LEVEL: smoke
          LLM_PROVIDER: gemini
          EMBEDDINGS_PROVIDER: gemini
