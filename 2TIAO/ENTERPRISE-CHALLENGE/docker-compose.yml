services:
  # ─────────────────────────────────────────
  # Backend: FastAPI + LangGraph + FAISS
  # Entrypoint gera o índice FAISS se ausente, depois sobe o uvicorn.
  # ─────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    container_name: genera_backend
    ports:
      - "8000:8000"
    env_file:
      - src/backend/.env
    environment:
      - GENERA_DATA_PATH=/data/proposta_estrutura_de_dados.json
      - GENERA_FAISS_PATH=/app/faiss_index
      - GENERA_DB_PATH=/app/data/history.db
    volumes:
      - ./faiss_index:/app/faiss_index
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  # ─────────────────────────────────────────
  # Frontend: React + Nginx (proxy reverso)
  # ─────────────────────────────────────────
  frontend:
    build:
      context: src/frontend
      dockerfile: Dockerfile
    container_name: genera_frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
